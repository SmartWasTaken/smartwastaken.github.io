/* =========================================
   Estética terminal — Bootstrap 5 + overrides
   Regla de oro: ningún :hover cambia tamaño,
   padding, margen ni display. Solo color/borde/fondo.
   ========================================= */

:root {
  --bg-color: #050505;
  --text-color: #e0e0e0;
  --muted-color: #888;
  --dim-color: #8a8a8a;
  --line-color: #444;
  --font-mono: 'Courier Prime', monospace;

  /* Variables de Bootstrap */
  --bs-body-bg: var(--bg-color);
  --bs-body-color: var(--text-color);
  --bs-body-font-family: var(--font-mono);
  --bs-link-color-rgb: 224, 224, 224;
  --bs-link-hover-color-rgb: 224, 224, 224;
}

body {
  background-color: var(--bg-color);
  color: var(--text-color);
  font-family: var(--font-mono);
  line-height: 1.6;
  overflow-x: hidden;
  min-height: 100vh;
  /* Sin flex ni align-items:center: si el contenido cambia de alto,
     la cabecera NO se recoloca verticalmente. */
}

a { text-decoration: none; }

/* ---------- Cursor personalizado (solo con ratón) ---------- */
.noise,
.cursor { display: none; }

.noise {
  display: block;
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  opacity: 0.04;
  background: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
}

@media (hover: hover) and (pointer: fine) {
  *, *::before, *::after { cursor: none !important; }

  .cursor {
    display: block;
    position: fixed;
    top: 0; left: 0;
    width: 20px; height: 20px;
    margin: -10px 0 0 -10px;           /* centrado sin transform */
    background-color: #fff;
    mix-blend-mode: difference;
    pointer-events: none;
    z-index: 9999;
    will-change: translate, scale;
  }

  /* El cursor crece con scale: no afecta al layout */
  .cursor.hovering { scale: 2.5; border-radius: 50%; }
  .cursor { transition: scale 0.2s ease, border-radius 0.2s ease; }
}

/* ---------- Estructura ---------- */
.app {
  position: relative;
  z-index: 10;
}

/* Título: cada letra reserva su hueco desde el principio (ver main.js) */
#typewriter-title { letter-spacing: -1px; min-height: 1.2em; }
#typewriter-title .ch { visibility: hidden; }
#typewriter-title .ch.on { visibility: visible; }

.title-cursor {
  display: inline-block;
  width: 0.4em;
  height: 1em;
  background-color: var(--text-color);
  vertical-align: text-bottom;
  margin-left: 6px;
  animation: blink 1s step-end infinite;
}

@keyframes blink { 50% { opacity: 0; } }

.subtitle { font-size: 0.9rem; color: var(--muted-color); }

/* ---------- Menú ---------- */
.menu { border-bottom: 1px dashed var(--line-color); }

.menu-item {
  background: none;
  border: 0;
  padding: 0.25rem 0;
  font: inherit;
  color: var(--dim-color);
  transition: color 0.2s;
}

.menu-item:hover,
.menu-item:focus-visible,
.menu-item.active-link { color: var(--text-color); }

.menu-item:focus-visible { outline: 1px dashed var(--text-color); outline-offset: 4px; }

/* ---------- Secciones ---------- */
.content-section { display: none; }

.content-section.active {
  display: block;
  animation: typeIn 0.2s ease-out;
}

@keyframes typeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

.contact-item { font-size: 1.1rem; overflow-wrap: anywhere; }

.achievements-list { list-style: none; padding: 0; margin: 1.5rem 0; }
.achievements-list li { margin-bottom: 0.8rem; padding-left: 1.2rem; text-indent: -1.2rem; }
.achievements-list li::before { content: "> "; color: var(--muted-color); }

.hover-invert {
  display: inline-block;
  padding: 0 4px;
  transition: background-color 0.2s, color 0.2s;
}
.hover-invert:hover,
.hover-invert:focus-visible {
  background-color: var(--text-color);
  color: var(--bg-color);
}

/* ---------- Proyectos ---------- */
.project-list { list-style: none; padding: 0; margin: 0; }
.project-list li { margin-bottom: 0.75rem; }

.project-list-footer {
  margin-top: 1.5rem;
  border-top: 1px dashed var(--line-color);
  padding-top: 1rem;
}

.project-link {
  display: block;                      /* ocupa siempre el mismo sitio */
  padding: 4px 8px;
  border: 1px solid transparent;       /* el borde ya existe: no hay "salto" */
  color: var(--text-color);
  transition: border-color 0.2s, background-color 0.2s;
}

.project-link:hover,
.project-link:focus-visible,
.project-link.selected { border-color: var(--text-color); }

/* Caja de descripción: altura FIJA, el texto hace scroll si no cabe */
.desc-box {
  height: 20rem;
  padding: 1.25rem;
  border: 1px solid var(--line-color);
  background: #0a0a0a;
  overflow-y: auto;
}

.desc-box p {
  white-space: pre-line;
  font-size: 0.95rem;
  line-height: 1.5;
}

/* En escritorio la caja acompaña a la lista al hacer scroll */
@media (min-width: 992px) {
  .desc-box { position: sticky; top: 1.5rem; }
}


/* ---------- Foto ---------- */
.photo-frame {
  margin: 0;
  padding: 0.6rem;
  max-width: 240px;
  border: 1px solid var(--line-color);
  background: #0a0a0a;
}
.photo-frame img {
  display: block;
  width: 100%;
  aspect-ratio: 4 / 5;               /* reserva el hueco: no hay salto al cargar */
  object-fit: cover;
  object-position: 48% 30%;          /* encuadra la cara */
  filter: grayscale(1) contrast(1.05);
  transition: filter 0.3s;
}
.photo-frame:hover img { filter: none; }   /* solo cambia el color, nunca el tamaño */
.photo-frame figcaption { margin-top: 0.5rem; font-size: 0.85rem; color: var(--muted-color); }
@media (min-width: 768px) { .photo-frame { max-width: none; } }

.lang-toggle { color: var(--dim-color); }
.lang-toggle span { transition: color 0.2s; }
.lang-toggle span.on { color: var(--text-color); text-decoration: underline; text-underline-offset: 4px; }
.lang-toggle:hover span { color: var(--text-color); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- Disponibilidad ---------- */
.avail { font-size: 0.9rem; margin: 0.5rem 0 0; }
.avail .dot { display: inline-block; width: 0.6em; height: 0.6em; border-radius: 50%; background: var(--text-color); margin-right: 0.5rem; animation: blink 1.6s step-end infinite; }

/* ---------- Botones tipo terminal ---------- */
.btn-term { display: inline-block; padding: 0.3rem 0.8rem; border: 1px solid var(--line-color); background: none; color: var(--text-color); font: inherit; font-size: 0.9rem; transition: background-color 0.2s, color 0.2s, border-color 0.2s; }
.btn-term:hover, .btn-term:focus-visible { background: var(--text-color); color: var(--bg-color); border-color: var(--text-color); }

/* ---------- Proyectos: filtros y lista ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
.chip { background: none; border: 1px solid var(--line-color); color: var(--dim-color); font: inherit; font-size: 0.85rem; padding: 0.1rem 0.6rem; transition: color 0.2s, border-color 0.2s; }
.chip:hover, .chip:focus-visible, .chip.on { color: var(--text-color); border-color: var(--text-color); }
button.project-link { width: 100%; text-align: left; background: none; font: inherit; transition: border-color 0.2s, opacity 0.2s; }
.project-link .pname { display: block; font-size: 1.05rem; }
.project-link .pkind { display: block; font-size: 0.8rem; color: var(--muted-color); }
.project-link.dim { opacity: 0.3; }

/* ---------- Panel de detalle (altura fija) ---------- */
.detail { display: flex; flex-direction: column; height: 36rem; border: 1px solid var(--line-color); background: #0a0a0a; }
@media (min-width: 992px) { .detail { position: sticky; top: 1.5rem; } }
.detail-media { position: relative; flex: none; aspect-ratio: 16 / 9; border-bottom: 1px solid var(--line-color); overflow: hidden; background: #000; }
.detail-media img { display: block; width: 100%; height: 100%; object-fit: cover; }
.detail-media .ph { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; padding: 1rem; text-align: center; font-size: 0.8rem; color: var(--dim-color); overflow-wrap: anywhere; }
.detail-media.missing img { display: none; }
.detail-media.missing .ph { display: flex; }
.detail-body { flex: 1; overflow-y: auto; padding: 1rem 1.25rem; }
.detail-body h3 { font-size: 1.1rem; font-weight: 700; margin: 0; }
.detail-meta { font-size: 0.8rem; color: var(--muted-color); margin: 0 0 0.75rem; }
.detail-desc { white-space: pre-line; font-size: 0.92rem; line-height: 1.5; margin: 0; }
.detail-links { flex: none; min-height: 3.25rem; display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; padding: 0.6rem 1.25rem; border-top: 1px dashed var(--line-color); }

/* ---------- Experiencia y formación ---------- */
.section-label { font-size: 0.9rem; color: var(--muted-color); border-bottom: 1px dashed var(--line-color); padding-bottom: 0.4rem; margin: 0 0 1.25rem; }
.exp-item { margin-bottom: 1.75rem; }
.exp-head { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.exp-date, .exp-org { color: var(--muted-color); font-size: 0.9rem; }
.edu-row { display: flex; gap: 1rem; margin-bottom: 0.75rem; }
.edu-year { flex: none; width: 6.5rem; color: var(--muted-color); }

/* ---------- Mini terminal ---------- */
.term { margin-top: 3rem; border: 1px solid var(--line-color); background: #0a0a0a; padding: 0.75rem 1rem; font-size: 0.9rem; }
.term:focus-within { border-color: var(--text-color); }
.term-out { height: 7.5rem; overflow-y: auto; color: var(--muted-color); white-space: pre-wrap; overflow-wrap: anywhere; }
.term-in { display: flex; gap: 0.5rem; align-items: center; margin: 0.5rem 0 0; padding-top: 0.5rem; border-top: 1px dashed var(--line-color); }
.term-in input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text-color); font: inherit; }
.term-in input::placeholder { color: var(--dim-color); }
.kbd-hint { font-size: 0.8rem; color: var(--dim-color); margin: 0.75rem 0 0; }

  </style>
</head>

/* ---------- 1. Cursor personalizado (solo dispositivos con ratón) ---------- */
function initCursor() {
  if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;

  const cursor = document.querySelector('.cursor');

  document.addEventListener('mousemove', (e) => {
    // "translate" se aplica antes que "scale", así el círculo crece sin desplazarse
    cursor.style.translate = `${e.clientX}px ${e.clientY}px`;
  });

  // Delegación: un solo listener sirve para todos los elementos clicables
  const selector = 'a, button';
  document.addEventListener('mouseover', (e) => {
    if (e.target.closest(selector)) cursor.classList.add('hovering');
  });
  document.addEventListener('mouseout', (e) => {
    if (e.target.closest(selector)) cursor.classList.remove('hovering');
  });
}

/* ---------- 2. Typewriter sin saltos de layout ----------
   Se pintan TODAS las letras desde el principio (invisibles) y se van
   revelando. Así el título ocupa su altura final desde el primer frame. */
function initTypewriter() {
  const title = document.getElementById('typewriter-title');
  const text = title.dataset.text;

  title.setAttribute('aria-label', text);
  title.textContent = '';

  const letters = [...text].map((char) => {
    const span = document.createElement('span');
    span.className = 'ch';
    span.setAttribute('aria-hidden', 'true');
    span.textContent = char;
    title.appendChild(span);
    return span;
  });

  const caret = document.createElement('span');
  caret.className = 'title-cursor';
  caret.setAttribute('aria-hidden', 'true');
  title.appendChild(caret);

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduceMotion) {
    letters.forEach((l) => l.classList.add('on'));
    return;
  }

  let i = 0;
  const typeNext = () => {
    if (i >= letters.length) return;
    letters[i++].classList.add('on');
    setTimeout(typeNext, 50 + Math.random() * 100);
  };
  setTimeout(typeNext, 500);
}

/* =========================================
   ESTADO Y UTILIDADES
   ========================================= */
const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
let lang = 'es';
let selected = null;
let filter = 'all';

const tr = (path) => path.split('.').reduce((o, k) => (o == null ? o : o[k]), I18N[lang]);
const el = (tag, cls, text) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
};
const cvUrl = () => (lang === 'es' ? 'assets/cv-es.pdf' : 'assets/cv-en.pdf');

/* =========================================
   IDIOMA
   ========================================= */
function setLang(next) {
  lang = next;
  document.documentElement.lang = lang;
  document.title = tr('meta.title');
  $('meta[name="description"]').content = tr('meta.desc');

  $$('[data-i18n]').forEach((n) => { n.textContent = tr(n.dataset.i18n); });
  $$('[data-i18n-html]').forEach((n) => { n.innerHTML = tr(n.dataset.i18nHtml); });
  $$('[data-i18n-alt]').forEach((n) => { n.alt = tr(n.dataset.i18nAlt); });
  $$('#lang-toggle [data-l]').forEach((s) => s.classList.toggle('on', s.dataset.l === lang));
  $('#cv-link').href = cvUrl();
  $('#term-input').placeholder = tr('term.placeholder');

  const hl = $('#highlights'); hl.textContent = '';
  tr('about.hl').forEach((t) => hl.append(el('li', '', t)));

  renderProjectList();
  renderDetail();
  renderExperience();
  renderTech();
  try { localStorage.setItem('lang', lang); } catch (e) { /* sin almacenamiento: no pasa nada */ }
}

function initLang() {
  let saved = null;
  try { saved = localStorage.getItem('lang'); } catch (e) {}
  const browser = (navigator.language || 'es').toLowerCase().startsWith('es') ? 'es' : 'en';
  setLang(saved in I18N ? saved : browser);
  $('#lang-toggle').addEventListener('click', () => setLang(lang === 'es' ? 'en' : 'es'));
}

/* =========================================
   PESTAÑAS (con #hash para enlaces directos)
   ========================================= */
function showTab(id, updateHash = true) {
  if (!TABS.includes(id)) id = 'about';
  $$('.menu-item[data-target]').forEach((t) => {
    const on = t.dataset.target === id;
    t.classList.toggle('active-link', on);
    t.setAttribute('aria-selected', String(on));
  });
  $$('.content-section').forEach((s) => s.classList.toggle('active', s.id === id));
  if (updateHash) { try { history.replaceState(null, '', '#' + id); } catch (e) {} }
}

function initTabs() {
  $$('.menu-item[data-target]').forEach((t) => t.addEventListener('click', () => showTab(t.dataset.target)));
  showTab(location.hash.slice(1), false);
  window.addEventListener('hashchange', () => showTab(location.hash.slice(1), false));
}

/* =========================================
   PROYECTOS: lista, filtros y panel fijo
   ========================================= */
function renderProjectList() {
  const items = tr('projects.items');
  const ul = $('#project-list'); ul.textContent = '';
  PROJECTS.forEach((p) => {
    const li = el('li');
    const b = el('button', 'project-link');
    b.type = 'button';
    b.dataset.project = p.id;
    b.append(el('span', 'pname', '>> ' + items[p.id].name), el('span', 'pkind', items[p.id].kind));
    ['mouseenter', 'focus', 'click'].forEach((ev) => b.addEventListener(ev, () => select(p.id)));
    li.append(b); ul.append(li);
  });
  applyFilter();
  markSelected();
}

function applyFilter() {
  $$('.chip').forEach((c) => c.classList.toggle('on', c.dataset.filter === filter));
  $$('.project-link').forEach((b) => {
    const p = PROJECTS.find((x) => x.id === b.dataset.project);
    b.classList.toggle('dim', !(filter === 'all' || p.tags.includes(filter)));   // se atenúa, no se oculta: nada se mueve
  });
}

function markSelected() {
  $$('.project-link').forEach((b) => b.classList.toggle('selected', b.dataset.project === selected));
}

function select(id) {
  if (selected === id) return;
  selected = id;
  markSelected();
  renderDetail();
}

function renderDetail() {
  const t = tr('projects');
  const p = PROJECTS.find((x) => x.id === selected);
  const media = $('#detail-media'), img = $('#detail-img'), links = $('#detail-links');
  links.textContent = '';

  if (!p) {
    $('#detail-title').textContent = t.idleTitle;
    $('#detail-meta').textContent = '';
    $('#detail-desc').textContent = t.idle;
    $('#detail-ph').textContent = t.idlePh;
    img.removeAttribute('src');
    media.classList.add('missing');
    return;
  }

  const it = t.items[p.id];
  const src = 'assets/projects/' + p.id + '.jpg';
  $('#detail-title').textContent = it.name;
  $('#detail-meta').textContent = it.meta;
  $('#detail-desc').textContent = it.desc;
  $('#detail-ph').textContent = '[ ' + src + ' ]';
  img.alt = it.name;
  if (img.getAttribute('src') !== src) { media.classList.add('missing'); img.src = src; }

  p.links.forEach(([kind, url]) => {
    const a = el('a', 'btn-term', t.link[kind]);
    a.href = url; a.target = '_blank'; a.rel = 'noopener';
    links.append(a);
  });
}

function initProjects() {
  const img = $('#detail-img');
  img.addEventListener('load', () => $('#detail-media').classList.remove('missing'));
  img.addEventListener('error', () => $('#detail-media').classList.add('missing'));
  $$('.chip').forEach((c) => c.addEventListener('click', () => { filter = c.dataset.filter; applyFilter(); }));
}

/* =========================================
   EXPERIENCIA Y TECH
   ========================================= */
function renderExperience() {
  const box = $('#exp-list'); box.textContent = '';
  tr('exp.items').forEach((i) => {
    const art = el('article', 'exp-item');
    const head = el('div', 'exp-head');
    head.append(el('strong', '', i.role), el('span', 'exp-date', i.date));
    art.append(head, el('div', 'exp-org', i.org));
    const ul = el('ul', 'achievements-list');
    i.bullets.forEach((b) => ul.append(el('li', '', b)));
    art.append(ul);
    box.append(art);
  });
  const edu = $('#edu-list'); edu.textContent = '';
  tr('exp.edu').forEach(([year, title, place]) => {
    const row = el('div', 'edu-row');
    const txt = el('div');
    txt.append(el('strong', '', title), el('div', 'exp-org', place));
    row.append(el('span', 'edu-year', year), txt);
    edu.append(row);
  });
}

function renderTech() {
  const box = $('#tech-list'); box.textContent = '';
  tr('tech.rows').forEach(([label, value]) => {
    const p = el('p', 'contact-item');
    p.append('> ', el('strong', '', label + ':'), ' ' + value);
    box.append(p);
  });
}

/* =========================================
   MINI TERMINAL Y ATAJOS DE TECLADO
   ========================================= */
function initTerminal() {
  const out = $('#term-out'), input = $('#term-input');
  const print = (text) => { out.append(el('div', '', text)); out.scrollTop = out.scrollHeight; };
  print(tr('term.welcome'));

  const run = (raw) => {
    const [cmd, ...rest] = raw.toLowerCase().split(/\s+/);
    const arg = rest.join(' ');
    const tabs = { about: 'about', projects: 'projects', proyectos: 'projects', exp: 'experience', experience: 'experience', experiencia: 'experience', tech: 'tech', contact: 'contact', contacto: 'contact' };
    if (tabs[cmd]) { showTab(tabs[cmd]); return; }
    switch (cmd) {
      case 'help':   print(tr('term.help')); break;
      case 'ls':     print(PROJECTS.map((p) => p.id).join('  ')); break;
      case 'open': {
        const p = PROJECTS.find((x) => x.id === arg);
        if (!p) { print(tr('term.noproj')); break; }
        showTab('projects'); select(p.id); break;
      }
      case 'cv':     print(tr('term.cv')); window.open(cvUrl(), '_blank'); break;
      case 'lang':   (arg in I18N) ? setLang(arg) : print(tr('term.langUsage')); break;
      case 'whoami': print(tr('term.whoami')); break;
      case 'clear':  out.textContent = ''; break;
      case 'sudo':   print(arg.startsWith('hire') ? tr('term.hire') : tr('term.sudo')); break;
      default:       print(tr('term.unknown') + cmd);
    }
  };

  input.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const raw = input.value.trim();
    input.value = '';
    if (!raw) return;
    print('> ' + raw);
    run(raw);
  });
}

function initShortcuts() {
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
    if (e.key >= '1' && e.key <= String(TABS.length)) showTab(TABS[Number(e.key) - 1]);
    else if (e.key.toLowerCase() === 'l') setLang(lang === 'es' ? 'en' : 'es');
    else if (e.key === '/') { e.preventDefault(); $('#term-input').focus(); }
  });
}

document.addEventListener('DOMContentLoaded', () => {
  initCursor();
  initTypewriter();
  initTabs();
  initProjects();
  initLang();
  initTerminal();
  initShortcuts();
});
